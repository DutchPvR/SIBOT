name: Build

# Compiles the app and widget for the simulator on every push, so errors show up without opening Xcode.
on:
  push:
    branches: [main]
  pull_request:

# The workflow can read the code and nothing else.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project SIBOT.xcodeproj \
            -scheme SIBOT \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | tail -n 40

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
