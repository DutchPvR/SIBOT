name: SIBOT
options:
  bundleIdPrefix: com.dutchpvr
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set this to your Apple Developer Team ID once your membership is active
    # (Xcode > Signing & Capabilities will also fill it in for you).
    DEVELOPMENT_TEAM: ""
targets:
  SIBOT:
    type: application
    platform: iOS
    sources:
      - SIBOT
      - Shared
      - path: WatchShared/WatchTimerPayload.swift
    info:
      path: SIBOT/Info.plist
      properties:
        CFBundleDisplayName: SIBOT
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSFaceIDUsageDescription: SIBOT uses Face ID to unlock your diary.
        NSCameraUsageDescription: SIBOT uses the camera to read restaurant menus and suggest the safest dishes.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: SIBOT/SIBOT.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dutchpvr.sibot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dutchpvr.sibot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: SIBOTWidget
      - target: SIBOTWatch
  SIBOTWidget:
    type: app-extension
    platform: iOS
    sources:
      - SIBOTWidget
      - Shared
    info:
      path: SIBOTWidget/Info.plist
      properties:
        CFBundleDisplayName: SIBOT Timer
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SIBOTWidget/SIBOTWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dutchpvr.sibot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dutchpvr.sibot.widget
        TARGETED_DEVICE_FAMILY: "1"
  # Apple Watch app: embedded in the iPhone app, shows Wait / OK to eat.
  # The watch has its own App Group container, so the iPhone sends the timer over
  # WatchConnectivity (SIBOT/Services/WatchSync.swift) and the watch stores it there.
  SIBOTWatch:
    type: application
    platform: watchOS
    sources:
      - SIBOTWatch
      - WatchShared
      - path: Shared/MealTimerStore.swift
    info:
      path: SIBOTWatch/Info.plist
      properties:
        CFBundleDisplayName: SIBOT
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.dutchpvr.sibot
        WKRunsIndependentlyOfCompanionApp: false
    entitlements:
      path: SIBOTWatch/SIBOTWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dutchpvr.sibot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dutchpvr.sibot.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
    dependencies:
      - target: SIBOTWatchWidget
  # The watch face complication (WidgetKit).
  SIBOTWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - SIBOTWatchWidget
      - WatchShared
      - path: Shared/MealTimerStore.swift
    info:
      path: SIBOTWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: SIBOT
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SIBOTWatchWidget/SIBOTWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dutchpvr.sibot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dutchpvr.sibot.watchkitapp.safetoeat
        TARGETED_DEVICE_FAMILY: "4"
